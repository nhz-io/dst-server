name: Build DST server image

# Polls Steam for a new Don't Starve Together dedicated server build and
# publishes ghcr.io/nhz-io/dst-server:<version>-<recipe> + :<version> + :latest
# when either the game or the Dockerfile changes.
# The version probe downloads ONLY version.txt (7 bytes), so the schedule is
# cheap; the full 4.3 GB fetch happens only on an actual new release.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  DD_VERSION: DepotDownloader_3.4.0
  IMAGE: ghcr.io/nhz-io/dst-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DepotDownloader
        run: |
          curl -sL -o dd.zip "https://github.com/SteamRE/DepotDownloader/releases/download/${DD_VERSION}/DepotDownloader-linux-x64.zip"
          unzip -oq dd.zip -d dd && chmod +x dd/DepotDownloader

      - name: Probe current server version
        id: probe
        run: |
          printf 'version.txt\n' > filelist.txt
          ./dd/DepotDownloader -app 343050 -os linux -dir probe -filelist filelist.txt
          VERSION=$(tr -cd '0-9' < probe/version.txt)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "DST server version on Steam: $VERSION"
          # The recipe is part of the identity: a Dockerfile change must
          # rebuild even when Klei has not shipped (2026-10-27: the runtime
          # fix had to republish 760178). Tag :<version>-<recipe hash>.
          echo "tag=$VERSION-$(sha256sum Dockerfile | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: check
        run: |
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:nhz-io/dst-server:pull" | jq -r .token)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "https://ghcr.io/v2/nhz-io/dst-server/manifests/${{ steps.probe.outputs.tag }}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json")
          echo "exists=$([ "$CODE" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "manifest check for ${{ steps.probe.outputs.tag }}: HTTP $CODE"

      - name: Download full game
        if: steps.check.outputs.exists == 'false'
        run: |
          ./dd/DepotDownloader -app 343050 -os linux -dir game -validate
          rm -rf game/.DepotDownloader
          # -f, not -x: DepotDownloader does not set the executable bit; the
          # Dockerfile chmods the entrypoint itself.
          test -f game/bin64/dontstarve_dedicated_server_nullrenderer_x64

      - name: Download Steam client runtime (Steamworks SDK Redist)
        if: steps.check.outputs.exists == 'false'
        run: |
          # steamclient.so for ~/.steam/sdk*, see the Dockerfile for why it
          # is load-bearing (player save-folder naming).
          ./dd/DepotDownloader -app 1007 -os linux -dir sdk
          ls -la sdk sdk/linux64
          test -f sdk/linux64/steamclient.so && test -f sdk/steamclient.so  # 32-bit lives at the root

      - name: Bin-pack game tree into ten layer buckets
        if: steps.check.outputs.exists == 'false'
        run: |
          # Split game/ into parts/part0..part9, size-balanced. One docker
          # layer per bucket keeps every registry blob small — a single ~3 GB
          # blob was observed failing with `tls: bad record MAC` on the
          # consuming network, while small blobs pass. Entries are moved at
          # depth 2 (game/data/* etc.) so no single entry dominates a bucket.
          python3 - <<'PY'
          import os, shutil
          def du(p):
              if os.path.isfile(p): return os.path.getsize(p)
              return sum(os.path.getsize(os.path.join(r, f))
                         for r, _, fs in os.walk(p) for f in fs)
          # Recurse into any directory bigger than THRESHOLD so no single
          # entry dominates a bucket (data/sound alone is ~1.6 GB; its
          # individual sound banks are <300 MB).
          THRESHOLD = 300 * 1024 * 1024
          def collect(p):
              if os.path.isfile(p) or du(p) <= THRESHOLD:
                  yield p
              else:
                  for c in sorted(os.listdir(p)):
                      yield from collect(os.path.join(p, c))
          entries = [e for top in sorted(os.listdir("game"))
                       for e in collect(os.path.join("game", top))]
          buckets = [[0, i, []] for i in range(10)]
          sized = sorted(((du(e), e) for e in entries), reverse=True)
          for size, e in sized:
              b = min(buckets)
              b[0] += size; b[2].append(e)
          for size, i, items in buckets:
              os.makedirs(f"parts/part{i}", exist_ok=True)
              for e in items:
                  dest = os.path.join(f"parts/part{i}", os.path.relpath(e, "game"))
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  shutil.move(e, dest)
              print(f"part{i}: {size/1e6:.0f} MB, {len(items)} entries")
          PY

      - name: Login to ghcr
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        run: |
          V=${{ steps.probe.outputs.version }}
          T=${{ steps.probe.outputs.tag }}
          docker build --build-arg DST_VERSION=$V -t $IMAGE:$T -t $IMAGE:$V -t $IMAGE:latest .
          docker push $IMAGE:$T
          docker push $IMAGE:$V
          docker push $IMAGE:latest
